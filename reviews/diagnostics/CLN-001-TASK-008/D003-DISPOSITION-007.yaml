clauses:
  D003-P1:
    disposition: REFER_TO_INDEPENDENT_ADDITIVE_AS_CLARIFICATION_REVIEW
    meaning: >-
      Conditional consumer-decodable implicit n is a potentially exact
      representation of the existing indexed-output relation; mathematical
      observer rank alone is not physical index supply. Do not make
      RI effective or approve a service before AS-level clarification
      and distinct review. Any actual decoder must use information
      available to the identified consumer throughout the supported
      sequence lifetime, with no silent wrap or forced reset.
    AS_impact: EXPLICIT_ADDITIVE_CLARIFICATION_REQUIRED_BEFORE_OPERATIONAL_ELIGIBILITY
  D003-P2:
    disposition: ACCEPT_AS_CONSERVATIVE_RESTATEMENT_NO_MECHANISM
    meaning: >-
      Valid acceptance, numeric commitment, attempted acquisition,
      rejection and result publication are distinct. An accepted event
      continues to owe exactly one indexed result even across stalls,
      errors or resets; fault reporting is not delivery. This is not
      permission to assume an infinite pending queue, crash recovery,
      lossless backpressure or permanent liveness.
    AS_impact: PROPOSE_ADDITIVE_OBSERVABLE_LIFECYCLE_CLARIFICATION_BEFORE_INTERFACE_CONTRACT
  D003-P3:
    disposition: ACCEPT_PRESERVATION_REFER_RESET_ORDERING_TO_AS_REVIEW
    meaning: >-
      Reset begins zero-padded numeric history but old accepted result
      debt is not canceled or allowed to alias new sequence work.
      Reset completion, acknowledgment, producer/consumer lifetime,
      result drain or separately distinguishable delivery remain unselected.
    AS_impact: EXPLICIT_ADDITIVE_RESET_ASSOCIATION_CLARIFICATION_REQUIRED
  D003-P4:
    disposition: ACCEPT_AS_DEPENDENCY_DISCLOSURE_ONLY
    meaning: >-
      RN and C-HIST are not established. A service proposal needs separately
      reviewed provider, exact event binding, coherent snapshot, retention,
      reset/lifetime, availability and ownership/accounting contracts.
    AS_impact: NONE_UNLESS_CONTRACT_CHANGES_ACCEPTED_BEHAVIOR
  D003-P5:
    disposition: ACCEPT_AS_EVALUATION_GUARDRAIL_ONLY
    meaning: >-
      H1-H6 are UNKNOWN for every realized AP; F active axes stay
      RAM_peak, compute_effort, device_energy_consumption. Count detector
      attributable RAM and keep external work visible. T1/T2 are scoped;
      47 octets is a conditional information capacity minimum.
    AS_impact: NONE
