    due: Later authorized lifecycle and functional verification.
  - id: T002-4
    status: OPEN
    evidence: One result with correct logical accepted-event association; chosen protocol refinement and authorized exhaustion behavior if applicable.
    due: Later authorized interface and functional verification.
  - id: T002-5
    status: OPEN
    evidence: Invalid-input state and index invariance, explicit rejection and reporting of detectable faults; documented detection limits.
    due: Later authorized interface verification before input-contract compliance claims.
  - id: T002-6
    status: OPEN
    evidence: Complete attributable peak RAM accounting and no hardware-FPU dependency; distinguish host from target evidence.
    due: Later authorized realization and verification; target evidence before target-compliance claims.
  - id: T002-7
    status: OPEN
    evidence: Comparable scoped operation models or target measurements and declared electrical energy workload/scope; target/toolchain evidence.
    due: Applicable later authorized stage before real-hardware operation or qualification claims.
  - id: T002-8
    status: OPEN_DEFERRED_R4
    evidence: Threshold, duration, boolean decision and integration criteria followed by appropriate verification.
    due: Before claiming a complete sustained-energy detector.
review_and_authority_gates:
  - order: 1
    gate: Distinct independent review of these proposal artifacts against the pinned allowlisted baseline.
    focus: Boundary completeness, logical association, restricted horizons, shared ownership, F scopes and authority fidelity.
    satisfied_here: false
  - order: 2
    gate: Human sponsor or authorized diagnostic delegate explicitly disposes this proposal and alternatives in a separate versioned record.
    satisfied_here: false
  - order: 3
    gate: Any changed requirement or concrete operating restriction receives additive clarification or separate explicit contract and independent review before acceptance.
    satisfied_here: false
  - order: 4
    gate: Separate authorization for AP generation and later selection, with applicability and H1-H6 evidence before comparison or compliance claims.
    satisfied_here: false
  - order: 5
    gate: Any new proof or finite-horizon extension requires separately authorized proof work and independent review.
    satisfied_here: false
contradictions:
  accepted_baseline_actual_contradiction_found: false
  conditional_review_trigger: >-
    A concrete demand combining arbitrary epoch length, exact natural-number n,
    sole internal index generation and finite closed deterministic state is
    inconsistent. AS does not currently demand that combination.
