proposed_new_diagnostic_decision:
  title: Require explicit boundary and index refinement disclosures before AP comparison
  nature: PROPOSED_AUDIT_POLICY_NOT_AN_ARCHITECTURE_SELECTION
  clauses:
    - number: 1
      proposal: >-
        Preserve the accepted abstract PS: one exact energy and its logical
        one-based accepted-event association per event in each initialized or
        explicitly reset sequence. Do not prescribe a stored counter, unbounded
        internal integers, an external label provider or a bounded epoch.
      basis: [AS.PS, D001.interface_and_lifecycle_Q4, D001.requirements.R1, D001.requirements.R2, D001.requirements.R3]
    - number: 2
      proposal: >-
        Require each separately authorized later candidate to state its concrete
        association contract and refinement to the logical pair, and enumerate
        all retained or consulted output-affecting information, ownership,
        access, retention, reset, validation and service-failure semantics.
        Keep history options A, B and C available for evaluation without
        treating any as approved or assuming their feasibility.
      basis: [AS.C, AS.PS, D001.requirements.R5, D001.delivery_and_exceptions_Q6, PD.review_clarifications]
    - number: 3
      proposal: >-
        Preserve R5 accounting: detector-owned persistent state, scratch and
        owned stack count toward 2048 bytes; only exclusively upstream-owned
        memory has the stated exclusion. Disclose consulted upstream costs
        separately. Shared attribution remains unresolved until supported by
        ownership evidence or an explicit reviewed authority clarification.
      basis: [D001.requirements.R5, AS.R5, F.decision]
    - number: 4
      proposal: >-
        Apply T1 only to future numeric equivalence on its accepted unrestricted
        continuation domain. Apply T2 only after deterministic exact behavior,
        complete retained-state accounting, unrestricted continuations and
        no uncounted replay are established for the named boundary. Do not
        impose PD A4 as an AS-wide no-replay requirement or equate complete
        information bits with measured detector SRAM.
      basis: [PD.accepted_mathematical_claims.T1, PD.accepted_mathematical_claims.T2]
    - number: 5
      proposal: >-
        Treat wider-protocol association as a possible concrete refinement,
        not an assumed existing service. Require explicit new disposition and
        reviewed contract/AS clarification before imposing finite epochs or
        exhaustion behavior. Do not allow silent index wrap, saturation,
        autonomous reset, rejected otherwise-valid events or operational
        loss padding to redefine the accepted PS.
      basis: [AS.PS, AS.Lifecycle, D001.interface_and_lifecycle_Q4, D001.delivery_and_exceptions_Q6, PD.review_clarifications]
    - number: 6
      proposal: >-
        Keep accepted F axes and H1-H6 unchanged. Require common contract,
        workload, resource and energy scopes and evidence levels for any
        later Pareto comparison. Unknown values remain UNKNOWN. Resolve
        changed F definitions through a new versioned decision and reassessment.
        Maintain T002-2 through T002-8 open, including deferred R4 detection.
      basis: [F.decision, F.continuing_obligations, TRACE.remaining_verification_and_integration_obligations]
  limits:
    - No clause is approved or effective by issuance of this proposal.
    - No protocol, width, epoch length, lifetime, error policy or architecture is selected.
    - No hard 1 ms execution deadline or device-energy threshold is introduced.
    - No new theorem, proof disposition, realization measurement or target feasibility claim is made.
alternatives_for_disposition:
  - id: PRESERVE_ABSTRACT_PS_WITH_DISCLOSURE
    status: RECOMMENDED_FOR_CONSIDERATION_ONLY
    consequence: Keeps representation and information placement open while requiring auditable candidate contracts.
    selection: null
  - id: DEFER_NEW_POLICY
    consequence: Keep all accepted records unchanged and seek specific missing interface facts before any new decision or AP comparison.
    selection: null
  - id: REQUIRE_A_CLOSED_NUMERIC_DETECTOR
    consequence: >-
      Makes detector-local no-replay an additional restriction; requires explicit
      new diagnostic authority and independent review of additive AS clarification.
      T2 still needs a complete information/storage map and supplies no sufficient budget.
    selection: null
  - id: AUTHORIZE_A_SPECIFIC_B_OR_C_SERVICE_CONTRACT
    consequence: >-
      Adds explicit service guarantees and accounting. B must substantiate
      exclusive upstream ownership; C must resolve shared attribution. T2
      can apply only at a complete closed boundary; detector-local replay defeats local A4.
    selection: null
  - id: AUTHORIZE_I_WIDER_PROTOCOL_ASSOCIATION
    consequence: >-
      Specify and review exact association, acceptance, invalid-input and reset
      behavior and resource costs. External index support is not already supplied
      by AS and must not become an uncounted numeric-history oracle.
    selection: null
  - id: AUTHORIZE_II_BOUNDED_INDEX_CONTRACT
    consequence: >-
      Decide width, encoding, maximum accepted epoch and explicit behavior before
      exhaustion. Requires new synthetic authority and reviewed additive AS
      clarification or separate contract that does not silently override PS.
      Reassess finite-horizon theorem applicability.
    selection: null
  - id: DEMAND_III_EXACT_UNBOUNDED_CLOSED_INDEX
    consequence: >-
      Incompatible when deterministic finite closed state alone must generate
      exact natural-number indices for arbitrary epoch lengths. Refer the
      conflicting concrete assumptions to renewed AS-level review; do not adopt
      as feasible. PO-003-3 remains UNPROVEN in the accepted record.
    selection: null
theorem_applicability:
  A4_names_are_distinct:
    AS_A4: RAM_model_and_2048_byte_bound
    PD_A4: additional_complete_state_no_replay_hypothesis
  T1:
    status: ACCEPTED_EXACT_MATHEMATICAL_CLAIM_FROM_PD
    domain: Finite accepted histories over unsigned 0..4095 and all nonempty unrestricted continuations.
    equivalence: Same future numeric outputs iff padded ordered last-31 tails agree.
    excluded: [current_emitted_output, empty_continuation, logical_indices, interface_metadata, physical_storage_allocation]
  T2:
    status: ACCEPTED_CONDITIONALLY_FROM_PD
    conditions:
      - Fixed accepted length n >= 32.
      - Deterministic exact numeric machine.
      - Complete retained output-affecting state included in the named boundary.
      - No outside replay or readable uncounted history.
      - Unrestricted future continuations and qualifying reachable histories.
    conclusion: At least 2^372 distinguishable reachable complete states and 372 information bits or 47 whole 8-bit octets of capacity.
    not_concluded:
      - Detector-local SRAM lower bound when outside retained information is consulted.
      - A sufficient 47-byte implementation or actual RAM allocation.
      - Full-index feasibility, target fit, latency, compute or electrical energy cost.
    local_attribution_gate: Prove all relevant retained information is detector-local; map storage to counted RAM for any RAM-capacity inference.
    replay_gate: B and history-consulting C fail local no-replay; enlarged-boundary use requires inclusion of all service/backing information.
    finite_epoch_gate: Recheck restricted continuations; do not automatically transfer the unrestricted theorem to a truncated contract.
  continuing_unproven: [PO-003-1, PO-003-3]
f_evidence:
  hard_gates: [H1_EXACTNESS, H2_STARTUP_RESET, H3_PER_EVENT_PAIR, H4_INVALID_AND_OBSERVABLE_FAULTS, H5_OWNED_RAM_2048_BYTE_CEILING, H6_NO_HARDWARE_FPU_DEPENDENCE]
  active_axes: [RAM_peak, compute_effort, device_energy_consumption]
  all_nine_combinations: [A-I, A-II, A-III, B-I, B-II, B-III, C-I, C-II, C-III]
