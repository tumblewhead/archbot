accepted_clarifications:
  A008_R1:
    exact_index_supply: >-
      Preserve one exact pair (n,E_n) for every accepted valid event.
      Physical representation may be explicit or implicit ONLY if an
      actual consumer, with genuinely available accepted-event/reset
      association and state, can exactly decode the one-based accepted
      event rank throughout all accepted sequence lifetimes.
      Observer-only rank, lone request ID or energy-only response
      without retained accepted-rank association is insufficient.
    not_an_approval_of_RI: true
  A008_R2:
    accepted_result_obligation: >-
      Every accepted valid event owes a correctly associated logical
      result even across stalls, faults, reset or restart; reporting
      an error does not fulfill that obligation. Invalid attempts
      neither advance the accepted index nor numeric or association
      state. No universal crash survival, reliable exactly-once
      transport or infinite availability is inferred.
  A008_R3:
    observable_reset: >-
      Explicit reset begins new zero-padded numeric history and rank;
      old accepted results cannot alias new-sequence results.
      Consumer-visible reset ordering and unambiguous association
      are required. A separate acknowledgment event is optional;
      drain, marker, version tag or other mechanism is unselected.
      Finite tags need validated lifetime/retirement/reuse conditions.
    mandatory_distinct_acknowledgment: false
