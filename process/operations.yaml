# Allowlisted reusable operations. Add new operations only when their playbooks exist.
# This is an execution-role registry, not an authority or approval record.
version: 1
operations:
  EVALUATE_AP:
    role: evaluation-agent
    playbook: process/playbooks/EVALUATE_AP.md
  REVIEW_AP_EVALUATION:
    role: verification-agent
    playbook: process/playbooks/REVIEW_AP_EVALUATION.md
  DEFINE_CON:
    role: contract-agent
    playbook: process/playbooks/DEFINE_CON.md
  REVIEW_CON:
    role: verification-agent
    playbook: process/playbooks/REVIEW_CON.md
