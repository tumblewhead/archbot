program_campaign:
  ordered_milestones:
    - id: C1_TOY1_END_TO_END
      status: PARTIAL
      objective: "Complete Toy 1 controlled AS/P/F, AP, CON, DE, C implementation, independent evidence and honest final acceptance scope."
    - id: C2_GENERIC_FRAMEWORK_FREEZE
      status: IN_PROGRESS_NOT_FROZEN
      objective: "Finish genericity FR-001 through FR-006 independently from Toy 1 domain authority."
    - id: C3_CLEANROOM_TOY1_NO_DIALOGUE
      status: NOT_AUTHORIZED
      objective: "Replay Toy 1 from only permitted unsolved inputs using the frozen framework without the dialogue layer."
    - id: C4_PROJECT_DIALOGUE
      status: PLANNED
      objective: "Add structured human-agent engineering interviews, explanations, revisions and project-local archive."
    - id: C5_CLEANROOM_TOY1_WITH_DIALOGUE
      status: PLANNED
      objective: "Replay Toy 1 with dialogue and compare engineering correctness, intervention, rework and provenance."
    - id: C6_TOY2_AND_SCALE
      status: PLANNED
      objective: "Retarget generic engine to a distinct numerical root solver, then increase novelty, complexity and team scale."
  campaign_dependency: "The existing qualification campaign puts Toy 1 evidence and generic framework freeze before the cleanroom. Do not treat pre-freeze repair work as final Toy 1 completion."
project_isolation:
  status: ARCHITECTURAL_DIRECTION_DEFINED_MIGRATION_NOT_AUTHORIZED
  contract: process/layout/PC_PROJECT_BOUNDARY_001.yaml
  design: docs/PROJECT_BOUNDARY_LAYOUT_001.md
  proposal: process/proposals/PC_PROJECT_ISOLATION_MIGRATION_001.yaml
  source_migration_authorized: false
  objective: "Framework installed once; projects portable self-contained folders; per-project work ignored; no cross-project authority leakage."
  blockers:
    - "tools/pc.py still embeds Toy 1 AS-001 evidence path and root knowledge."
    - "tools/task.py still assumes process/tasks and reviews at repository root."
    - "tools/gates/binding.py imports Toy 1-specific validator from generic tool root."
    - "process/tasks, process/decisions, reviews, docs and tests mix project and framework authority."
  acceptance_demo: "Empty projects -> none active; drop Toy 1 -> usable; drop second -> isolated; remove Toy 1 -> no active residue; fresh empty project -> no inherited solutions."
  cleanroom_limit: "Deleting worktree folder does not erase Git history; FR-005 must use a separate package without old .git, old artifacts or hidden context."
next_eligible_action:
  type: HUMAN_APPROVAL_GATE
  subject: Portable project-root migration
  proposal: process/proposals/PC_PROJECT_ISOLATION_MIGRATION_001.yaml
  design: docs/PROJECT_BOUNDARY_LAYOUT_001.md
  contract: process/layout/PC_PROJECT_BOUNDARY_001.yaml
  instruction: "Approve or revise the bounded migration from mixed roots to permanent framework plus self-contained projects; no bulk move or source-route changes before approval."
  fr003_focused_review_accepted: true
  fr004_separate_authorization_required: true
  framework_frozen: false
  prohibit:
