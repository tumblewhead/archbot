    - "Do not move accepted Toy 1 assets or rewrite review receipts until migration is separately authorized."
    - "Do not treat R1 FR-003 ACCEPT as product acceptance or broad framework freeze."
    - "Do not begin FR-004 source work, cleanroom or VO discharge without appropriate authority."
restart_protocol:
  - "Fetch and verify current GitHub main HEAD; never assume this checkpoint revision remains HEAD."
  - "Read AGENTS.md, PROJECT_SPINE.md and this roadmap in that order."
  - "Read only the linked task-relevant authority and evidence files, then applicable role/playbook and pull-run-push contract."
  - "Compare the roadmap's status against newer independent reviews and explicit decisions; if it conflicts, do not invent a reconciliation."
  - "Identify the next eligible bounded action, specify its exact existing authorization and files, and act only within scope."
  - "Commit roadmap and PROJECT_SPINE.md updates alongside every meaningful authorized milestone transition; keep accepted old receipts immutable."
  - "Give exact pull/run/selective-stage/commit/push commands when local work is due."
authority_limits:
