north_star:
  process: "Reusable proof-driven Progressive Concretization from evidence, AS/P/F, AP, CON and DE to implementation, verification and controlled acceptance."
  generalization: "Run the same generic engine, roles and playbooks on materially different engineering projects, with their own project baselines and validators."
  evidence: "Preserve provenance, complete obligations, reproducibility and independently reviewed decisions."
  human_use: "Make engineering work clear, auditable and practically usable by a team."
  initial_qualification: "Complete Toy 1 evidence and a controlled framework freeze, then independently replay Toy 1 and progress to Toy 2."
operating_assumption:
  audience: COOPERATIVE
  risk_in_scope: "Accidental dropped requirements, stale evidence, incorrect selection, unreviewed transitions and prior-solution leakage."
  risk_outside_scope: "Deliberate repository forgery, maliciously rewritten policy/history, cryptographic tamper resistance."
  principle: "Authority continuity through accepted project baselines and controlled changes, not a Toy 1 allowlist in the generic engine."
human_machine_split:
  assistant: "Author and review scoped changes through connected GitHub; commit source; inspect human-pushed evidence."
  human: "Pull, run local tests and separate Codex reviewer sessions, inspect and selectively stage/commit/push evidence."
  safety: "No invented passing results, self-review acceptance, force push, broad staging or claim that a green test discharges a VO."
