program_campaign:
  ordered_milestones:
    - id: C1_TOY1_END_TO_END
      status: PARTIAL
      objective: "Complete Toy 1 controlled AS/P/F, AP, CON, DE, C implementation, independent evidence and honest final acceptance scope."
    - id: C2_GENERIC_FRAMEWORK_FREEZE
      status: IN_PROGRESS_NOT_FROZEN
      objective: "Finish genericity FR-001 through FR-006 independently from Toy 1 domain authority."
    - id: C3_CLEANROOM_TOY1_NO_DIALOGUE
      status: NOT_AUTHORIZED
      objective: "Replay Toy 1 from only permitted unsolved inputs using the frozen framework without the dialogue layer."
    - id: C4_PROJECT_DIALOGUE
      status: PLANNED
      objective: "Add structured human-agent engineering interviews, explanations, revisions and project-local archive."
    - id: C5_CLEANROOM_TOY1_WITH_DIALOGUE
      status: PLANNED
      objective: "Replay Toy 1 with dialogue and compare engineering correctness, intervention, rework and provenance."
    - id: C6_TOY2_AND_SCALE
      status: PLANNED
      objective: "Retarget generic engine to a distinct numerical root solver, then increase novelty, complexity and team scale."
  campaign_dependency: "The existing qualification campaign puts Toy 1 evidence and generic framework freeze before the cleanroom. Do not treat pre-freeze repair work as final Toy 1 completion."
