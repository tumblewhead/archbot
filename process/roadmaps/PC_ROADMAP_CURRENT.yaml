precedence:
  - "Read actual current Git HEAD and current authority receipts before acting."
  - "AGENTS.md and current PROJECT_SPINE.md govern startup, scope and next eligibility."
  - "This roadmap is a navigation/status index, not new authority to edit source or close gates."
  - "An independent review receipt and engineering-authority decision outrank planning text."
  - "Historical proposals and old roadmaps retain history; do not mistake their old next steps for current instructions."
north_star:
  process: "Reusable proof-driven Progressive Concretization from evidence, AS/P/F, AP, CON and DE to implementation, verification and controlled acceptance."
  generalization: "Run the same generic engine, roles and playbooks on materially different engineering projects, with their own project baselines and validators."
  evidence: "Preserve provenance, complete obligations, reproducibility and independently reviewed decisions."
  human_use: "Make engineering work clear, auditable and practically usable by a team."
  initial_qualification: "Complete Toy 1 evidence and a controlled framework freeze, then independently replay Toy 1 and progress to Toy 2."
operating_assumption:
  audience: COOPERATIVE
  risk_in_scope: "Accidental dropped requirements, stale evidence, incorrect selection, unreviewed transitions and prior-solution leakage."
  risk_outside_scope: "Deliberate repository forgery, maliciously rewritten policy/history, cryptographic tamper resistance."
  principle: "Authority continuity through accepted project baselines and controlled changes, not a Toy 1 allowlist in the generic engine."
human_machine_split:
  assistant: "Author and review scoped changes through connected GitHub; commit source; inspect human-pushed evidence."
  human: "Pull, run local tests and separate Codex reviewer sessions, inspect and selectively stage/commit/push evidence."
  safety: "No invented passing results, self-review acceptance, force push, broad staging or claim that a green test discharges a VO."
framework:
  current_milestone: FR-002-GATE-ADAPTER
  stage_order:
    - id: GENERICITY_PREFREEZE_AUDIT
      status: REVIEWED_WITH_CLARIFICATIONS
      evidence: reviews/qualification/REVIEW_GENERICITY_PREFREEZE_001-receipt.json
      exit: "Reviewed obstacle inventory; source fixes require their own authorization."
    - id: FR-001-PROJECT-CONTEXT
      status: INDEPENDENTLY_ACCEPTED_WITH_CLARIFICATIONS
      evidence: reviews/qualification/REVIEW_FR001_PROJECT_CONTEXT_R1_001-receipt.json
      scope: "Declared project spine controls telemetry role-projected context and exported context, not physical workspace isolation."
      exit: "Scoped context selection independently reviewed."
    - id: FR-002-GATE-ADAPTER
      status: REDESIGN_REQUIRED_NOT_ACCEPTED
      authority: process/decisions/FR-002-GATE-ADAPTER-AUTHORIZATION-001.yaml
      first_independent_review: reviews/qualification/REVIEW_FR002_GATE_ADAPTER_001-receipt.json
      first_review_verdict: REVISE
      historical_r1_source: 4c1810ecf520a7c2741c4a517532d05f1ee595fd
      historical_r1_local_evidence: reviews/qualification/FR002_GATE_ADAPTER_R1-local-test-receipt.json
      paused_review_task: process/tasks/REVIEW_FR002_GATE_ADAPTER_R1-001.yaml
      paused_reason: "Review tests an adversarial trust-root model superseded by the cooperative-audience decision."
      chosen_direction: "Project-owned accepted-baseline continuity, explicit authority transitions, reusable generic AP mechanics and opt-in project validators."
      replacement_proposal: process/proposals/FR002_BASELINE_CONTINUITY_REPLACEMENT_001.yaml
      replacement_design: docs/FR002_BASELINE_CONTINUITY_REPLACEMENT_001.md
      replacement_status: PROPOSED_NOT_AUTHORIZED
      next: "Seek explicit human approval or revision of the bounded FR-002 baseline-continuity source replacement; then implement, test and independently review."
      exit: "No embedded Toy 1 project-authority list in generic gate; Toy 1 C-002 and negative controls preserved; another project uses same generic mechanics."
    - id: FR-003-HISTORICAL-INTEGRITY
      status: NOT_STARTED
      intent: "Read-only historical source-revision auditor distinct from current-applicability checking and reviewed-status overlay."
      exit: "Historical acceptance remains verifiable at its original revision without requiring present-worktree hashes to match."
    - id: FR-004-REVIEWER-EXECUTION
      status: NOT_STARTED
      intent: "Qualify the supported independent reviewer invocation mode(s) with real completed turns and accurate launch-failure records."
      exit: "An independent review can be invoked and evidenced reproducibly; render alone does not count as execution."
    - id: FR-005-CLEANROOM-PACKAGE
      status: NOT_STARTED
      intent: "Positive-allowlist package that excludes prior Toy 1 solutions, logs, hidden evaluation material and accidental historical leakage."
      design: docs/CLN_BOUNDARY_PREFREEZE_001.md
      exit: "Fresh agent can receive only permitted source inputs; isolation tested, not merely claimed."
    - id: FR-006-INTEGRATED-FREEZE
      status: NOT_STARTED
      intent: "Separate independent integrated qualification and explicit framework-freeze decision."
      exit: "Evidence covers all required generic process properties and unresolved limits are explicit."
