purpose: "Recover the complete Progressive Concretization goal, current authority and next eligible work without chat context."
source_of_truth:
  operating_contract: AGENTS.md
  current_checkpoint: PROJECT_SPINE.md
  qualification_campaign: docs/QUALIFICATION_CAMPAIGN.md
