lessons:
  - id: PROGRESS-1
    finding: "Independent review can validate unchanged UNKNOWNs without advancing physical feasibility."
    corrective_rule_proposed: >-
      Every high-impact decision-blocking UNKNOWN must carry an owner,
      a discriminating evidence-acquisition task, due gate and a
      decision it would unlock. Reviewer receipt is not evidence creation.
    classification: PROCESS_DESIGN_NOT_ACTIVATED
  - id: HUMAN-TIME-1
    finding: "Manual pull, agent launch, archive, push and recover are mechanical oversight overhead."
    corrective_rule_proposed: >-
      A deterministic, durable orchestrator should automate authorized
      mechanical transitions, retaining human attention for changed
      requirements, risk, AP commitments and surprising evidence.
    classification: HARNESS_DESIGN_NOT_IMPLEMENTED
  - id: SOURCES-1
    finding: "Numerical state, accepted-result debt and consumer index have different information lifetimes."
    corrective_rule_proposed: "Require evidence at explicitly owned consumer and publication boundaries."
    classification: NEW_CLN001_CONDITIONAL_WORK_NOT_GATE_DISCHARGE
  - id: IMPLEMENTATION-S0
    finding: "Implementation structure and resource consumption should be visible before algorithms obscure the module boundary."
    user_direction: "Always begin implementation with a linkable skeleton; populate the skeleton afterward."
    corrective_rule_proposed: >-
      Build and link the entire intended module/API/port skeleton first,
      record a baseline linker map, symbols, section placement and
      incomplete stack/resource inventory, then populate one reviewed
      contract or DE at a time with size/dependency deltas.
    status: USER_REQUEST_RECORDED_PROPOSED_GENERIC_PLAYBOOK_REVISION
    implementation_protocol: docs/IMPLEMENTATION_SKELETON_FIRST_001.md
    proposed_playbook: process/playbooks/IMPLEMENT_DE.md
    note: "The existing exploratory CLN001 C prototypes cannot be retroactively represented as skeleton-first evidence."

  - id: SERIALIZATION-EGM-1
    user_source: archbot_research_note/v1.0
    received: "2026-10-28"
    finding: >-
      A fresh Goldfish is useful as an intentional architecture
      serialization/deserialization test, not just a new-chat review.
      The Elephant's hidden conversational context must not be needed
      to reconstruct implementation-critical dependencies.
    corrective_rule_proposed: >-
      Project-owned deterministic context compilation plus a private,
      source-grounded reconstruction reference. Treat failed
      reconstruction as a candidate missing-specification or graph-link
      defect, while independently distinguishing agent errors and
      source projection/OS isolation failures.
    status: HUMAN_RESEARCH_NOTE_CAPTURED_EGM_P0_NOT_ACTIVATED
    design: docs/EGM_GOLDFISH_SERIALIZATION_001.md
    roadmap: process/roadmaps/EGM_GOLDFISH_001.yaml
