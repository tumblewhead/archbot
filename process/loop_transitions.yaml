version: 1
transitions:
  - id: contract_revision
    receipt_schema: pc-contract-review/v1
    requires:
      gate: CONTRACT_REVIEW
      disposition: REVISE
      next_stage_recommendation: CON_REVISION_REQUIRED
      independent_of_authoring_invocation: true
    require_blocking_finding: true
    operation: REVISE_CON
    target: receipt
    trigger_kind: CONTRACT_REVIEW_REVISION_REQUIRED
    gate: CONTRACT_REVIEW
  - id: contract_review
    receipt_schema: pc-gate-receipt/v1
    requires:
      gate: CONTRACT_REVIEW
      status: CONTRACTS_READY_FOR_INDEPENDENT_REVIEW
    operation: REVIEW_CON
    target: changed_concept
    concept_type: Contract Spine
    related_concept_type: Design Contract
    trigger_kind: CONTRACT_DRAFT_SUBMITTED
    gate: CONTRACT_REVIEW
  - id: stage_evidence_gap
    receipt_schema: pc-gate-receipt/v1
    requires:
      gate: CONTRACT_REVIEW
      status: CONTRACTS_UNRESOLVED
    require_unresolved: true
    operation: PLAN_EVIDENCE
    target: receipt
    trigger_kind: STAGE_EVIDENCE_REQUIRED
    gate: EVIDENCE_PLANNING
  - id: evidence_plan_back_to_contract_revision
    receipt_schema: pc-evidence-plan/v1
    requires:
      gate: EVIDENCE_PLANNING
      status: EVIDENCE_PLAN_READY_FOR_REVISION
    operation: REVISE_CON
    target: receipt
    trigger_kind: EVIDENCE_PLAN_READY
    gate: CONTRACT_REVIEW
  - id: as_revision_independent_review
    receipt_schema: pc-gate-receipt/v1
    requires:
      gate: AS_REVIEW
      status: AS_REVISION_READY_FOR_INDEPENDENT_REVIEW
    operation: REVIEW_AS
    target: changed_concept
    concept_type: Architecture Statement
    related_concept_type: null
    trigger_kind: AS_REVISION_SUBMITTED
    gate: AS_REVIEW
  - id: as_revision_after_independent_review
    receipt_schema: pc-as-review/v1
    requires:
      gate: AS_REVIEW
      disposition: REVISE
      gate_status: AS_REVISION_REQUIRED
      independent_of_authoring_invocation: true
    require_blocking_finding: true
    operation: REVISE_AS
    target: receipt
    trigger_kind: AS_REVIEW_REVISION_REQUIRED
    gate: AS_REVIEW
  - id: contract_unresolved_scope_review
    receipt_schema: pc-con-authoring-receipt/v1
    requires:
      operation: DEFINE_CON
      gate_status: CONTRACTS_UNRESOLVED
    require_unresolved: true
    operation: REVIEW_CON
    target: changed_concept
    concept_type: Contract Spine
    related_concept_type: Design Contract
    trigger_kind: CONTRACT_UNRESOLVED_SUBMITTED
    gate: CONTRACT_REVIEW
  - id: contract_revised_authoring_review
    receipt_schema: pc-con-authoring-receipt/v1
    requires:
      operation: REVISE_CON
      gate_status: CONTRACTS_READY_FOR_INDEPENDENT_REVIEW
    operation: REVIEW_CON
    target: changed_concept
    concept_type: Contract Spine
    related_concept_type: Design Contract
    trigger_kind: CONTRACT_DRAFT_SUBMITTED
    gate: CONTRACT_REVIEW
  - id: accepted_contract_to_design
    receipt_schema: pc-contract-review/v1
    requires:
      gate: CONTRACT_REVIEW
      disposition: ACCEPT_WITH_CLARIFICATIONS
      next_stage_recommendation: CON_ACCEPTABLE_FOR_DE_REFINEMENT
      independent_of_authoring_invocation: true
    operation: DECOMPOSE_DE
    target: receipt
    trigger_kind: CONTRACT_ACCEPTED_FOR_DE
    gate: DE_REVIEW
  - id: accepted_contract_to_design_without_clarifications
    receipt_schema: pc-contract-review/v1
    requires:
      gate: CONTRACT_REVIEW
      disposition: ACCEPT
      next_stage_recommendation: CON_ACCEPTABLE_FOR_DE_REFINEMENT
      independent_of_authoring_invocation: true
    operation: DECOMPOSE_DE
    target: receipt
    trigger_kind: CONTRACT_ACCEPTED_FOR_DE
    gate: DE_REVIEW
  - id: design_submission_review
    receipt_schema: pc-de-authoring-receipt/v1
    requires:
      operation: DECOMPOSE_DE
      gate: DE_REVIEW
      status: DE_READY_FOR_INDEPENDENT_REVIEW
    operation: REVIEW_DE
    target: changed_concept
    concept_type: Design Element Spine
    related_concept_type: Design Element
    trigger_kind: DE_DRAFT_SUBMITTED
    gate: DE_REVIEW
