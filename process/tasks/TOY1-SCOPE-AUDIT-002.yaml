      - Distinguish invented 1ms throughput from intrinsic per-sample rolling-sum semantics
      - Trace each loss-detection and watchdog clause to approved authority or necessary derivation
      - Identify minimal corrected AS candidate and exact dependent VO/proof/CON impact
