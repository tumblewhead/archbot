  reference: process/change_requests/CR-001-SYNTHETIC-REQUIREMENT-AUTHORITY.md
  revision: a210f119fdec00f26bef9773ff2614d925e9ec54
playbook: process/playbooks/AUDIT_SCOPE.md
context:
  selection: role_policy
  mandatory_dependency_closure: true
  include_raw_data_by_default: false
  review_inputs:
    disputed_source: knowledge/bkp/problem-origin.md
    synthetic_adc_source: knowledge/bkp/adc.md
    current_architecture_statement: knowledge/architecture/AS-001/statement.md
    verification_plan: knowledge/architecture/AS-001/verification_plan.md
    original_figure_of_merit: knowledge/architecture/AS-001/merit.md
    selected_ap: knowledge/architecture/AS-001/proposals/AP-002.md
    current_contract_spine: knowledge/architecture/AS-001/contracts/spine-v4.md
    last_evidence_plan: knowledge/architecture/AS-001/evidence/EP-003-CON004-shared-allocation.md
    current_authority: process/decisions/AP-002-PROVISIONAL-SELECTION-001.yaml
    current_vo_ledger: process/ledgers/vo_ledger.yaml
    human_objection: process/change_requests/CR-001-SYNTHETIC-REQUIREMENT-AUTHORITY.md
    predecessor_scope_audit_manifest: process/tasks/TOY1-SCOPE-AUDIT-001.yaml
