    - independent_scope_audit
    - source_authority_traceability
    - minimal_corrected_AS_proposal
    - bounded_review_receipt
    - affected_dependency_list
  prohibited:
    - edit_current_AS_or_F
    - amend_accepted_authority
    - overwrite_existing_contracts_or_proofs
    - discharge_or_delete_VOs
    - accept_new_debt
    - approve_contracts_or_DEs
    - implement_firmware
gate:
