schema: pc-ap-assessment/v2
candidate: AP-002
stage: AP
simulation_only: false
policy_id: AP-SELECT-002
scope_id: C-002-SCOPE-001
comparative_decision:
  mode: authorized_tradeoff
  authority: process/decisions/AP-002-PROVISIONAL-SELECTION-001.yaml
  architectural_debt: AD-003
  rationale: >-
    Engineering authority approved reversible AP-002 selection for CON-first
    work, accepting AD-003 under AP-SELECT-002 and the unchanged F-001.
    State SRAM is conditionally estimated and target cycles/flash are unknown.
    This is an authorized risk tradeoff, not a measured Pareto ranking.
  projected_dimensions:
    state_sram_bytes:
      estimate: 72
      uncertainty: conditional on envelope representation and object layout; not measured
      evidence: /architecture/AS-001/proposals/envelopes/AP-002-SRAM-ENVELOPE-001.md
    worst_case_cycles_per_update:
      estimate: unknown
      uncertainty: fixed bounded update work is known abstractly; target cycles not established
      evidence: /architecture/AS-001/proposals/envelopes/AP-002-SRAM-ENVELOPE-001.md
    flash_bytes:
      estimate: unknown
      uncertainty: no concrete build or target compiler
      evidence: /architecture/AS-001/proposals/envelopes/AP-002-SRAM-ENVELOPE-001.md
  proposed_tradeoff:
    status: accepted_in_separate_authority_record
    authority_needed: engineering authority
    rationale: If both candidates clear their AP obligations, choose whether to prioritize lower expected update work or a different F-001 Pareto dimension while cycles and flash remain uncertain.
    architectural_debt: AD-003 (proposal only; not entered as accepted)
requirements:
  C-001:
    stage_status: SATISFIED
    evidence:
      - /bkp/adc.md
      - /reviews/gates/VO-001-AS-ACCEPTANCE-001.json
    vo: VO-001
    final_status: DISCHARGED
  C-002:
    stage_status: CONDITIONALLY_SATISFIED
    evidence: [/architecture/AS-001/decisions/C-002-SCOPE-001.md, /architecture/AS-001/proposals/envelopes/AP-002-SRAM-ENVELOPE-001.md]
    assumptions:
      - CON/DE enforce one detector task, one non-nested detector ISR, no heap, and the stated category caps.
      - Shared memory attribution and simultaneous peaks conform to the envelope; actual physical allocation remains unverified.
    vo: VO-002
    final_status: OPEN
    memory_envelope:
      boundary: detector_charged_sram
      limit_bytes: 2048
      aggregation: nonoverlapping_peak
      nonoverlap_reasoning: >-
        Sum category caps conservatively; task and interrupt stacks are separate
        allocations and both are charged. Scratch outside task stack is bounded
        separately; CON/DE must reconcile any stack-resident overlap. No heap.
      buckets:
        persistent_state: {max_bytes: 72, basis: "32 uint16 ring entries, 32-bit rolling sum and index/control allowance, as proposed in AP-002 envelope"}
        temporary_or_scratch: {max_bytes: 64, basis: "Square and update temporaries/spills outside task-stack cap; later DE audit reconciles overlap"}
        detector_stack: {max_bytes: 384, basis: "Proposed dedicated detector task stack cap; static/compiler stack verification is later"}
        detector_attributable_interrupt_context: {max_bytes: 128, basis: "Proposed single non-nested detector ISR context/stack cap"}
        detector_attributable_shared_allocations: {max_bytes: 128, basis: "Proposed handoff, mailbox and synchronization cap with named detector attribution"}
        detector_attributable_dynamic_allocations: {max_bytes: 0, basis: "No-heap assumption; CON forbids allocation and DE scans allocator references"}
        other_detector_attributable: {max_bytes: 128, basis: "Allowance for alignment, padding and directly attributable sections; later inventory required"}
      reserved_margin_bytes: 1024
      unknown_unbounded_contributors: []
      budget_enforcement: >-
        CON assigns ownership and caps; DE inventories allocations and enforces
        task/interrupt restrictions; implementation map, stack analysis and
        bounded runtime accounting verify the allocation. Failure reopens AP;
        this envelope is an allocation proposal, not physical proof.
      evidence_refs:
        - /architecture/AS-001/proposals/envelopes/AP-002-SRAM-ENVELOPE-001.md
        - /architecture/AS-001/decisions/C-002-SCOPE-001.md
    deferral: {owner: implementation-agent, method: Map/static SRAM accounting, compiler stack analysis and shared/dynamic attribution under approved scope, due_stage: IMPLEMENTATION, acceptance: "Independently reviewed evidence bounds all charged categories within 2048 bytes and preserves positive margin.", assumptions: "CON/DE retain envelope caps and no-heap/non-nested execution restrictions.", escalation: "Rebudget and revisit DE/CON/AP if a cap or margin cannot be demonstrated."}
  C-003:
    stage_status: CONDITIONALLY_SATISFIED
    evidence: [/architecture/AS-001/proposals/AP-002.md, /bkp/target.md]
    assumptions: ["The proposed algorithm and target arithmetic use integer operations only; compiled toolchain behavior remains to verify."]
    vo: VO-003
    final_status: OPEN
    deferral: {owner: implementation-agent, method: Inspect build and toolchain for floating-point use, due_stage: IMPLEMENTATION, acceptance: "Independent build/code inspection confirms no FPU reliance.", assumptions: "Implementation follows integer-only proposal.", escalation: "Rework implementation or revisit architecture if floating point is required."}
  R-001:
    stage_status: CONDITIONALLY_SATISFIED
    evidence: [/architecture/AS-001/proposals/envelopes/AP-002-SRAM-ENVELOPE-001.md, /architecture/AS-001/verification_plan.md]
    assumptions: ["Fixed bounded update work supports an AP feasibility argument; it is not target cycle or WCET evidence."]
    vo: VO-004
    final_status: OPEN
    deferral: {owner: verification-agent, method: Establish target-specific WCET or representative timing with documented interrupt load and margin, due_stage: TARGET_VALIDATION, acceptance: "Every update completes within 1 ms with documented margin.", assumptions: "Compiler, target profile, and interrupt load are recorded.", escalation: "Revisit implementation and then DE/CON/AP if timing fails."}
  R-002:
    stage_status: CONDITIONALLY_SATISFIED
    evidence: [/architecture/AS-001/proofs/PR-002.md, /architecture/AS-001/proofs/PE-001-v2.md, /reviews/gates/proof-PR-002.json]
    assumptions:
      - Abstract proof is accepted only for exact rolling recurrence, zero initialization, early updates and wrap under its stated ring/index/update assumptions.
      - Concrete source-to-model correspondence, initialization, synchronization and integration remain open.
    vo: VO-005
    final_status: OPEN
    deferral: {owner: verification-agent, method: Verify implementation correspondence, reset, oldest-slot/index order, legal sample range and integration behavior, due_stage: IMPLEMENTATION, acceptance: "Independent review accepts concrete correspondence to accepted abstract recurrence.", assumptions: "Implementation uses PR-002 ring/update contract without concurrent mutation.", escalation: "Revise implementation/DE/CON/AP and invalidate dependent gate if correspondence fails."}
  R-003:
    stage_status: CONDITIONALLY_SATISFIED
    evidence: [/architecture/AS-001/proofs/PR-002.md, /architecture/AS-001/proofs/PE-001-v2.md, /reviews/gates/proof-PR-002.json]
    assumptions:
      - Abstract bound is below 2^29 for legal 12-bit inputs and accepted recurrence assumptions.
      - C expression widths, widening before multiplication, and state mapping remain to be checked at implementation.
    vo: VO-006
    final_status: OPEN
    deferral: {owner: proof-reviewer, method: Inspect C widths/promotions and prove invariant mapping/range checks, due_stage: IMPLEMENTATION, acceptance: "Independent review confirms concrete arithmetic cannot overflow for any legal input sequence.", assumptions: "PE-001-v2 assumptions and declared 0..4095 input range hold.", escalation: "Revise arithmetic/implementation and re-evaluate AP if any condition fails."}
